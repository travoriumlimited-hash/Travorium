<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Withdraw Money</title>

<style>
body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#07111f;
    color:white;
}

.container{
    max-width:450px;
    margin:30px auto;
    padding:20px;
    border:2px solid #0a6f59;
    border-radius:20px;
    background:#0b1422;
}

.title{
    background:#00d64f;
    color:#000;
    font-weight:bold;
    text-align:center;
    padding:15px;
    border-radius:8px;
    font-size:28px;
}

label{
    display:block;
    margin-top:20px;
    margin-bottom:8px;
    font-size:18px;
}

input,select{
    width:100%;
    padding:15px;
    background:#1c2432;
    color:white;
    border:1px solid #0a6f59;
    border-radius:10px;
    font-size:18px;
    box-sizing:border-box;
}

.total{
    margin-top:25px;
    border:1px solid #0a6f59;
    border-radius:10px;
    padding:20px;
    font-size:20px;
}

.total b{
    color:#00ff66;
    font-size:32px;
}

button{
    width:100%;
    margin-top:25px;
    padding:18px;
    background:#00d64f;
    color:black;
    font-size:24px;
    border:none;
    border-radius:10px;
    cursor:pointer;
    font-weight:bold;
}

.back{
    text-align:center;
    margin-top:20px;
}

.back a{
    color:orange;
    text-decoration:none;
    font-size:22px;
}
</style>

</head>

<body>

<div class="container">

<div class="title">
✦ WITHDRAW MONEY ✦
</div>

<label>Registered Number
<input type="text" id="number" value=

<label>Network Type</label>
<select id="network">
<option>MTN Mobile Money</option>
<option>Airtel Money</option>
</select>

<label>Amafaranga (Amount)</label>
<input type="number" id="amount" placeholder="Injiza amafaranga">

<div class="total">
Amafaranga Yoherezwa<br><br>
<b id="total">0 FRW</b>
</div>

<button onclick="withdraw()">
CONFIRM WITHDRAWAL 
</button>

<div class="back">
<a href="dashboard.html">← Subira Inyuma</a>
</div>

</div>

<script>
function withdraw(){

let number=document.getElementById("number").value;
let network=document.getElementById("network").value;
let amount=parseInt(document.getElementById("amount").value);

if(!amount || amount<=0){
alert("Injiza amafaranga.");
return;
}

document.getElementById("total").innerHTML=amount.toLocaleString()+" FRW";

alert(
"Withdrawal Request Submitted\n\n"+
"Number: "+number+
"\nNetwork: "+network+
"\nAmount: "+amount.toLocaleString()+" FRW"
);

}
</script>

</body>
</html>
