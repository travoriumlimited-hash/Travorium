<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Register</title>

<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#f2f2f2;
display:flex;
justify-content:center;
padding:20px;
}

.container{
background:#fff;
width:100%;
max-width:420px;
padding:25px;
border-radius:20px;
box-shadow:0 5px 15px rgba(0,0,0,.1);
}

h1{
font-size:35px;
font-weight:bold;
}

.bonus{
background:#2ecc71;
color:#fff;
padding:6px 15px;
border-radius:20px;
font-size:14px;
float:right;
margin-top:-40px;
}

p{
margin:20px 0;
color:#777;
line-height:1.6;
}

.field{
display:flex;
align-items:center;
border-bottom:1px solid #ddd;
margin:20px 0;
padding:12px 0;
}

.field i{
width:30px;
font-size:20px;
color:#777;
}

.field input{
border:none;
outline:none;
flex:1;
font-size:18px;
}

button{
width:100%;
background:#2ecc71;
color:#fff;
border:none;
padding:18px;
font-size:22px;
border-radius:40px;
cursor:pointer;
margin-top:20px;
}

button:hover{
background:#28b765;
}

.login{
text-align:center;
margin-top:30px;
font-size:22px;
}

.login a{
color:#0066ff;
text-decoration:none;
font-weight:bold;
}
</style>

</head>
<body>

<div class="container">

<h1>Sign Up</h1>
<div class="bonus">30000 frw BONUS</div>

<p>Create an account for only 3,900 RWF and start earning money easily. The sky is the limit!!</p>

<form action="dashboard.html">

<div class="field">
<i class="fa-solid fa-circle-user"></i>
<input type="text" placeholder="Your Full Name" required>
</div>

<div class="field">
<i class="fa-solid fa-user"></i>
<input type="text" placeholder="Username" required>
</div>

<div class="field">
<i class="fa-solid fa-at"></i>
<input type="email" placeholder="Email Address" required>
</div>

<div class="field">
<i class="fa-solid fa-lock"></i>
<input type="password" placeholder="Password" required>
</div>

<div class="field">
<i class="fa-solid fa-lock"></i>
<input type="password" placeholder="Confirm Password" required>
</div>

<button type="submit">Create Account</button>

</body>
</html>
