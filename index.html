<!DOCTYPE html>
<html>
<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Travorium Register</title>

<style>
body {
  font-family: Arial;
  background: #f2f2f2;
}

.register-box {
  width: 70%;
  max-width: 400px;
  margin: 50px auto;
  background: white;
  padding: 25px;
  text-align: center;
  border-radius: 10px;
}

input {
  width: 90%;
  padding: 12px;
  margin: 8px;
}

button {
  padding: 12px 30px;
  background: green;
  color: white;
  border: none;
  border-radius: 10px;
}
</style>

</head>

<body>

<div class="register-box">

<h2>TRAVORIUM REGISTER</h2>

<input type="text" id="name" placeholder="Amazina yawe">

<input type="tel" id="phone" placeholder="Numero ya telefone">

<input type="email" id="email" placeholder="Email">

<input type="password" id="password" placeholder="Password">

<input type="password" id="confirmPassword" placeholder="Confirm Password">

<br>

<button onclick="goPayment()">REGISTER</button>

</div>


<script>
function goPayment(){
  window.location.href="payment.html";
}
</script>


</body>
</html>
