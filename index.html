<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TRAVORIUM REGISTER</title>

<style>
body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f2f2f2;
}

.register-box{
    width:90%;
    max-width:400px;
    margin:40px auto;
    background:#fff;
    padding:25px;
    border-radius:12px;
    text-align:center;
    box-shadow:0 0 10px rgba(0,0,0,.1);
}

h2{
    margin-bottom:20px;
}

input{
    width:100%;
    padding:14px;
    margin:8px 0;
    border:1px solid #ccc;
    border-radius:6px;
    font-size:16px;
    box-sizing:border-box;
}

button{
    width:100%;
    padding:14px;
    margin-top:15px;
    background:green;
    color:white;
    border:none;
    border-radius:8px;
    font-size:18px;
    cursor:pointer;
}
</style>

</head>
<body>

<div class="register-box">

<h2>TRAVORIUM REGISTER</h2>

<input type="text" id="name" placeholder="Amazina yawe" required>

<input type="tel" id="phone" placeholder="Numero ya telefone" required>

<input type="email" id="email" placeholder="Email" required>

<input type="password" id="password" placeholder="Password" required>

<input type="password" id="confirmPassword" placeholder="Confirm Password" required>

<button onclick="goPayment()">REGISTER</button>

</div>

<script>
function goPayment(){

let name=document.getElementById("name").value;
let phone=document.getElementById("phone").value;
let email=document.getElementById("email").value;
let password=document.getElementById("password").value;
let confirm=document.getElementById("confirmPassword").value;

if(name==""||phone==""||email==""||password==""||confirm==""){
alert("Please fill all fields");
return;
}

if(password!==confirm){
alert("Passwords do not match");
return;
}

localStorage.setItem("name",name);
localStorage.setItem("phone",phone);
localStorage.setItem("email",email);

window.location.href="payment.html";
}
</script>

</body>
</html>
