<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Payment Methods</title>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:linear-gradient(135deg,#009688,#00c853);
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
padding:20px;
}

.card{
width:100%;
max-width:420px;
background:#fff;
border-radius:25px;
overflow:hidden;
box-shadow:0 15px 35px rgba(0,0,0,.25);
}

.header{
background:linear-gradient(135deg,#00695c,#00c853);
color:white;
padding:35px 20px;
text-align:center;
}

.header i{
font-size:55px;
margin-bottom:10px;
}

.header h2{
font-size:30px;
}

.content{
padding:25px;
}

.info{
background:#f4f4f4;
border-radius:15px;
padding:18px;
margin-bottom:18px;
text-align:center;
}

.info h4{
color:#666;
margin-bottom:8px;
}

.ussd{
font-size:25px;
font-weight:bold;
color:#009688;
word-break:break-all;
margin-bottom:14px;
}

.name{
font-size:22px;
font-weight:bold;
color:#333;
}

.pay-btn{
width:100%;
height:52px;
border:0;
border-radius:12px;
background:linear-gradient(135deg,#009688,#00c853);
color:white;
font-size:18px;
font-weight:bold;
cursor:pointer;
}

.pay-btn i{
margin-right:8px;
}

.copy-btn{
width:100%;
height:45px;
margin-top:10px;
border:1px solid #009688;
border-radius:12px;
background:white;
color:#009688;
font-size:16px;
font-weight:bold;
cursor:pointer;
}

label{
display:block;
font-weight:bold;
margin-bottom:6px;
color:#444;
}

.input-box{
position:relative;
margin-bottom:18px;
}

.input-box i{
position:absolute;
left:15px;
top:18px;
color:#009688;
}

.input-box input{
width:100%;
height:55px;
padding-left:45px;
border:1px solid #ccc;
border-radius:12px;
font-size:17px;
outline:none;
}

button[type="submit"]{
width:100%;
height:58px;
border:none;
border-radius:12px;
background:linear-gradient(135deg,#009688,#00c853);
color:white;
font-size:19px;
font-weight:bold;
cursor:pointer;
}

.footer{
text-align:center;
font-size:14px;
color:#777;
margin-top:18px;
}

@keyframes fade{
from{
opacity:0;
transform:translateY(20px);
}
to{
opacity:1;
transform:translateY(0);
}
}
</style>
</head>

<body>

<div class="card">

<div class="header">
<i class="fas fa-wallet"></i>
<h2>Payment Methods</h2>
</div>

<div class="content">

<!-- MTN -->
<div class="info">

<h4>Pay 4100 RWF via MTN Mobile Money</h4>

<div class="ussd">
*182*8*1*2193457#
</div>

<button class="pay-btn"
onclick="payMTN()">
<i class="fas fa-mobile-screen-button"></i>
Kanda Wishyure
</button>

<button class="copy-btn"
onclick="copyCode('*182*8*1*2193457#')">
<i class="fas fa-copy"></i>
Koporora USSD
</button>

</div>

<div class="info">

<h4>MTN Receiver Name</h4>

<div class="name">
Supervisor Charlotte
</div>

</div>


<!-- TIGO -->
<div class="info">

<h4>Pay 4100 RWF via Tigo Cash</h4>

<div class="ussd">
*500*1*2*0792147292#
</div>

<button class="pay-btn"
onclick="payTigo()">
<i class="fas fa-mobile-screen-button"></i>
Kanda Wishyure
</button>

<button class="copy-btn"
onclick="copyCode('*500*1*2*0792147292#')">
<i class="fas fa-copy"></i>
Koporora USSD
</button>

</div>

<div class="info">

<h4>Tigo Receiver Name</h4>

<div class="name">
Charlotte
</div>

</div>


<!-- FORM -->
<form onsubmit="submitPayment(event)">

<label>Full Name</label>

<div class="input-box">
<i class="fas fa-user"></i>
<input
type="text"
placeholder="Enter your name"
required>
</div>

<label>Phone Number</label>

<div class="input-box">
<i class="fas fa-phone"></i>
<input
type="tel"
placeholder="07XXXXXXXX"
required>
</div>

<label>Transaction ID</label>

<div class="input-box">
<i class="fas fa-receipt"></i>
<input
type="text"
placeholder="Enter Transaction ID"
required>
</div>

<button type="submit">
<i class="fas fa-check-circle"></i>
Confirm Payment
</button>

</form>

<div class="footer">
Secure Payment Verification
</div>

</div>
</div>


<script>

function payMTN(){

copyCode("*182*8*1*2193457#");

alert(
"USSD code copied!\n\n" +
"Open your Phone/Dialer and enter:\n" +
"*182*8*1*2193457#"
);

}

function payTigo(){

copyCode("*500*1*2*0792147292#");

alert(
"USSD code copied!\n\n" +
"Open your Phone/Dialer and enter:\n" +
"*500*1*2*0792147292#"
);

}

function copyCode(code){

if(navigator.clipboard){

navigator.clipboard.writeText(code)
.then(function(){

alert("USSD code copied successfully!");

})
.catch(function(){

fallbackCopy(code);

});

}else{

fallbackCopy(code);

}

}

function fallbackCopy(code){

var textArea=document.createElement("textarea");

textArea.value=code;

document.body.appendChild(textArea);

textArea.select();

document.execCommand("copy");

document.body.removeChild(textArea);

alert("USSD code copied successfully!");

}

function submitPayment(e){

e.preventDefault();

alert("Payment submitted successfully!");

window.location.href="dashboard.html";

}

</script>

</body>
</html>
