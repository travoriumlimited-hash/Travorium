<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Payment Methods</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:linear-gradient(135deg,#009688,#00c853);
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
padding:20px;
}

.card{
width:100%;
max-width:420px;
background:#fff;
border-radius:25px;
overflow:hidden;
box-shadow:0 15px 35px rgba(0,0,0,.25);
animation:fade .5s ease;
}

.header{
background:linear-gradient(135deg,#00695c,#00c853);
color:#fff;
padding:35px 20px;
text-align:center;
}

.header i{
font-size:55px;
margin-bottom:10px;
}

.header h2{
font-size:30px;
}

.content{
padding:25px;
}

.info{
background:#f4f4f4;
border-radius:15px;
padding:18px;
margin-bottom:18px;
text-align:center;
}

.info h4{
color:#666;
margin-bottom:8px;
}

.ussd{
font-size:28px;
font-weight:bold;
color:#009688;
}

.name{
font-size:22px;
font-weight:bold;
color:#333;
}

label{
display:block;
font-weight:bold;
margin-bottom:6px;
color:#444;
}

.input-box{
position:relative;
margin-bottom:18px;
}

.input-box i{
position:absolute;
left:15px;
top:18px;
color:#009688;
}

.input-box input{
width:100%;
height:55px;
padding-left:45px;
border:1px solid #ccc;
border-radius:12px;
font-size:17px;
outline:none;
transition:.3s;
}

.input-box input:focus{
border-color:#00c853;
box-shadow:0 0 8px rgba(0,200,83,.3);
}

button{
width:100%;
height:58px;
border:none;
border-radius:12px;
background:linear-gradient(135deg,#009688,#00c853);
color:white;
font-size:19px;
font-weight:bold;
cursor:pointer;
transition:.3s;
}

button:hover{
transform:translateY(-2px);
box-shadow:0 8px 20px rgba(0,0,0,.2);
}

.footer{
text-align:center;
font-size:14px;
color:#777;
margin-top:18px;
}

@keyframes fade{
from{
opacity:0;
transform:translateY(20px);
}
to{
opacity:1;
transform:translateY(0);
}
}
</style>
</head>

<body>

<div class="card">

<div class="header">
<i class="fas fa-wallet"></i>
<h2>Payment Methods</h2>
</div>

<div class="content">

<div class="info">
<h4>Pay 4700 RWF via MTN Mobile Money</h4>
<div class="ussd">*182*8*1*2112871#</div>
</div>

<div class="info">
<h4>Receiver Name</h4>
<div class="name">Supervisor Paciphique</div>
</div>

<form onsubmit="submitPayment(event)">

<label>Full Name</label>
<div class="input-box">
<i class="fas fa-user"></i>
<input type="text" placeholder="Enter your name" required>
</div>

<label>Phone Number</label>
<div class="input-box">
<i class="fas fa-phone"></i>
<input type="tel" placeholder="07XXXXXXXX" required>
</div>

<label>Transaction ID</label>
<div class="input-box">
<i class="fas fa-receipt"></i>
<input type="text" placeholder="Enter Transaction ID" required>
</div>

<button type="submit">
<i class="fas fa-check-circle"></i>
 Confirm Payment
</button>

</form>

<div class="footer">
Secure Payment Verification
</div>

</div>

</div>

<script>
function submitPayment(e){
e.preventDefault();
alert("Payment submitted successfully!");
window.location.href="dashboard.html";
}
</script>

</body>
</html>
