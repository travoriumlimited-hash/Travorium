<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Payment Methods</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#f3f3f3;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
    padding:20px;
}

.card{
    width:100%;
    max-width:420px;
    background:#fff;
    border-radius:25px;
    padding:30px;
    box-shadow:0 8px 25px rgba(0,0,0,.12);
}

h1{
    text-align:center;
    font-size:34px;
    margin-bottom:20px;
}

.method{
    text-align:center;
    font-size:18px;
    margin-bottom:20px;
}

.ussd{
    background:#f1f1f1;
    border-radius:15px;
    padding:18px;
    text-align:center;
    font-size:24px;
    font-weight:bold;
    margin-bottom:30px;
}

.account{
    text-align:center;
}

.account h3{
    font-size:26px;
    margin-bottom:5px;
}

.account p{
    font-size:22px;
}

hr{
    margin:30px 0;
    border:none;
    border-top:1px solid #ddd;
}

.confirm{
    text-align:center;
    font-size:30px;
    font-weight:bold;
    margin-bottom:25px;
}

input{
    width:100%;
    height:60px;
    border:1px solid #ddd;
    border-radius:12px;
    padding:15px;
    font-size:18px;
    margin-bottom:18px;
}

button{
    width:100%;
    height:60px;
    border:none;
    border-radius:12px;
    background:#008000;
    color:#fff;
    font-size:20px;
    font-weight:bold;
    cursor:pointer;
}

button:hover{
    background:#006d00;
}
</style>

</head>
<body>

<div class="card">

<h1>PAYMENT METHODS</h1>

<div class="method">
Shyura 3900 Frw ukoresheje MTN Mobile Money
</div>

<div class="ussd">
*182*1*1*0784006795#
</div>

<div class="account">
<h3>NAME:</h3>
<p>Supervisor Sylivel</p>
</div>

<hr>

<div class="confirm">
Confirm Payment
</div>

<form onsubmit="submitPayment(event)">

<input type="text" placeholder="Amazina yawe" required>

<input type="tel" placeholder="Numero ya telefone" required>

<input type="text" placeholder="Transaction ID" required>

<button type="submit">
Confirm Payment
</button>

</form>

</div>

<script>
function submitPayment(e){
    e.preventDefault();
    alert("Payment submitted successfully!");
    window.location.href="dashboard.html";
}
</script>

</body>
</html>
