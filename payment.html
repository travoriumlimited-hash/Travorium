<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Payment Methods</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#f2f2f2;
}

.card{
    width:90%;
    max-width:420px;
    margin:40px auto;
    background:#fff;
    border-radius:25px;
    padding:30px 20px;
    text-align:center;
}

h1{
    font-size:30px;
    font-weight:bold;
    margin-bottom:30px;
}

.method{
    font-size:18px;
    margin-bottom:20px;
}

.ussd{
    background:#f3f3f3;
    padding:22px;
    border-radius:15px;
    font-size:24px;
    font-weight:bold;
    margin-bottom:35px;
}

.name-title{
    font-size:22px;
    font-weight:bold;
}

.name{
    font-size:20px;
    margin-top:5px;
    margin-bottom:25px;
}

hr{
    border:none;
    border-top:1px solid #bbb;
    margin-bottom:30px;
}

.confirm{
    font-size:24px;
    font-weight:bold;
    margin-bottom:25px;
}

input{
    width:100%;
    height:55px;
    margin-bottom:18px;
    border:1px solid #ccc;
    border-radius:10px;
    padding:15px;
    font-size:18px;
}

button{
    width:75%;
    height:55px;
    background:green;
    color:#fff;
    border:none;
    border-radius:12px;
    font-size:20px;
    cursor:pointer;
}
</style>
</head>

<body>

<div class="card">

<h1>PAYMENT METHODS</h1>

<div class="method">
Shyura ukoresheje MTN Mobile Money
</div>

<div class="ussd">
*182*1*1*0784006795#
</div>

<div class="name-title">NAME:</div>

<div class="name">
Super Viser Sylivel
</div>

<hr>

<div class="confirm">Confirm Payment</div>

<form onsubmit="submitPayment(event)">
<input type="text" placeholder="Amazina yawe" required>
<input type="tel" placeholder="Numero ya telefone" required>
<input type="text" placeholder="Transaction ID" required>

<button type="submit">Confirm Payment</button>
</form>

</div>

<script>
function submitPayment(e){
    e.preventDefault();

    alert("Payment submitted successfully!");

    window.location.href = "dashboard.html";
}
</script>
}
</script>

</body>
</html>
