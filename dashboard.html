<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#f4f4f4;
display:flex;
justify-content:center;
padding:20px;
}

.dashboard{
width:100%;
max-width:420px;
background:#fff;
border-radius:25px;
padding:20px;
box-shadow:0 5px 20px rgba(0,0,0,.1);
}

.top{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:20px;
}

.top h1{
font-size:35px;
}

.dark{
font-size:30px;
cursor:pointer;
}

.card{
border-radius:25px;
padding:25px;
color:#fff;
margin-bottom:20px;
}

.balance{
background:linear-gradient(90deg,#5d4bff,#8b5cf6);
}

.balance h3{
font-size:20px;
font-weight:normal;
}

.balance h2{
margin-top:10px;
font-size:42px;
}

.row{
display:flex;
gap:15px;
margin-bottom:20px;
}

.small{
flex:1;
padding:25px;
border-radius:25px;
color:#fff;
}

.withdraw{
background:#171d2e;
}

.deposit{
background:#2dd36f;
}

.small h3{
font-size:20px;
font-weight:normal;
}

.small h2{
margin-top:15px;
font-size:36px;
}

.invest{
background:linear-gradient(90deg,#ff7b00,#ff3d5a);
text-align:center;
}

.invest h3{
font-size:22px;
}

.invest h2{
font-size:45px;
margin:15px 0;
}

button{
background:green;
color:white;
border:none;
padding:15px 40px;
font-size:20px;
border-radius:15px;
cursor:pointer;
}
</style>

</head>
<body>

<div class="dashboard">

<div class="top">
<h1>Dashboard</h1>
<div class="dark">🌙</div>
</div>

<div class="card balance">
<h3>Account Balance</h3>
<h2>RWF 30,000</h2>
</div>

<div class="row">

<div class="small withdraw">
<h3>Total Withdrawals</h3>
<h2>RWF 0</h2>
</div>

<div class="small deposit">
<h3>Deposit Wallet</h3>
<h2>RWF 0</
