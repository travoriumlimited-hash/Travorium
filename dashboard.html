<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Travorium Dashboard</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
background:#eef2f7;
}

.header{
background:linear-gradient(135deg,#00c853,#009688);
padding:35px 20px;
text-align:center;
color:white;
border-radius:0 0 30px 30px;
box-shadow:0 8px 20px rgba(0,0,0,.2);
}

.header h2{
font-size:30px;
margin-bottom:5px;
}

.container{
max-width:430px;
margin:auto;
padding:20px;
}

.balance-card{
background:linear-gradient(135deg,#009688,#00c853);
color:white;
padding:25px;
border-radius:20px;
box-shadow:0 12px 25px rgba(0,0,0,.2);
margin-top:-35px;
margin-bottom:20px;
}

.balance-card p{
opacity:.9;
}

.balance{
font-size:34px;
font-weight:bold;
margin-top:8px;
}

.grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:15px;
}

.box{
background:white;
border-radius:18px;
padding:20px;
text-align:center;
box-shadow:0 8px 18px rgba(0,0,0,.08);
transition:.3s;
}

.box:hover{
transform:translateY(-5px);
}

.icon{
font-size:34px;
margin-bottom:10px;
}

.box h4{
margin-bottom:8px;
color:#555;
}

.box b{
font-size:18px;
color:#009688;
}

.history{
background:white;
margin-top:20px;
padding:20px;
border-radius:18px;
box-shadow:0 8px 18px rgba(0,0,0,.08);
}

.history h3{
margin-bottom:10px;
}

.btn{
width:100%;
padding:16px;
border:none;
border-radius:14px;
font-size:17px;
font-weight:bold;
cursor:pointer;
margin-top:15px;
transition:.3s;
}

.withdraw{
background:linear-gradient(135deg,#00c853,#00e676);
color:white;
}

.logout{
background:#f44336;
color:white;
}

.btn:hover{
transform:scale(1.03);
}
</style>
</head>

<body>

<div class="header">
<h2>TRAVORIUM</h2>
<p>Welcome Back</p>
</div>

<div class="container">

<div class="balance-card">
<p>Total Balance</p>
<div class="balance">56,000 RWF</div>
</div>

<div class="grid">

<div class="box">
<div class="icon">👥</div>
<h4>Referrals</h4>
<b>0</b>
</div>

<div class="box">
<div class="icon">⏳</div>
<h4>Pending</h4>
<b>0 RWF</b>
</div>

<div class="box">
<div class="icon">💰</div>
<h4>Earnings</h4>
<b>56,000 RWF</b>
</div>

<div class="box">
<div class="icon">✅</div>
<h4>Status</h4>
<b>Active</b>
</div>

</div>

<div class="history">
<h3>Transaction History</h3>
<p>No transactions available.</p>
</div>

<button class="btn withdraw" onclick="window.location.href='withdrawal.html'">
💸 Withdraw Money
</button>

<button class="btn logout" onclick="logout()">
🚪 Logout
</button>

</div>

<script>
function logout(){
window.location.href="index.html";
}
</script>

</body>
</html>
