<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Travorium Dashboard</title>

<style>
body{
  font-family: Arial, sans-serif;
  background:#f2f2f2;
  margin:0;
}

.header{
  background:#0b57d0;
  color:white;
  padding:20px;
  text-align:center;
}

.container{
  width:90%;
  max-width:450px;
  margin:20px auto;
}

.card{
  background:white;
  padding:20px;
  margin:15px 0;
  border-radius:15px;
  box-shadow:0 3px 10px #ccc;
}

.balance{
  font-size:28px;
  font-weight:bold;
  color:#0b57d0;
}

.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:15px;
}

.box{
  background:white;
  padding:20px;
  border-radius:15px;
  text-align:center;
  box-shadow:0 3px 10px #ccc;
}

button{
  width:100%;
  padding:15px;
  border:none;
  border-radius:10px;
  background:#0b57d0;
  color:white;
  font-size:16px;
  margin-top:10px;
}

button:hover{
  opacity:0.8;
}
</style>

</head>

<body>

<div class="header">
<h2>TRAVORIUM</h2>
<p>Dashboard</p>
</div>

<div class="container">

<div class="card">
<h3>Balance</h3>
<div class="balance">30,000 Frw</div>
</div>


<div class="grid">

<div class="box">
<h3>👥</h3>
<p>Referrals</p>
<b>0</b>
</div>

<div class="box">
<h3>⏳</h3>
<p>Pending</p>
<b>0 Frw</b>
</div>

<div class="box">
<h3>💰</h3>
<p>Earnings</p>
<b>30,000 Frw</b>
</div>

<div class="box">
<h3>✅</h3>
<p>Status</p>
<b>Active</b>
</div>

</div>


<div class="card">
<h3>Transaction History</h3>
<p>No transactions yet</p>
</div>


<button onclick="withdraw()">Withdraw</button>

<button onclick="logout()">Logout</button>


</div>


<script>

function withdraw(){
 alert("Withdrawal request submitted successfully");
}


function logout(){
 window.location.href="index.html";
}

</script>

</body><a href="withdraw.html" style="text-decoration:none;">
  <button style="
    width:100%;
    max-width:320px;
    padding:16px;
    background:linear-gradient(135deg,#00d26a,#00a651);
    color:white;
    font-size:20px;
    font-weight:bold;
    border:none;
    border-radius:15px;
    cursor:pointer;
    box-shadow:0 6px 15px rgba(0,0,0,0.3);
  ">
    💸 Withdraw Money
  </button>
</a>
</html>
